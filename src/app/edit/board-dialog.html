<!-- The dialog has the look of the tile dialog of context/design/home.html. The mockup has no board settings dialog. -->
<!-- The dialog hears a press on the dimmed page and the Tab key from its controls. It is not a control itself, -->
<!-- and Escape and Cancel close it from the keyboard, so it takes no focus of its own. -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="sheet narrow"
  aria-labelledby="board-settings-title"
  data-caregiver-control
  (close)="events.closed()"
  (pointerdown)="events.pointerDown($event)"
  (click)="events.click($event)"
  (keydown)="events.key($event)"
>
  <form (submit)="submit($event)">
    <h2 id="board-settings-title">Board settings</h2>

    <div class="field">
      <label for="board-title">Title</label>
      <input
        #titleInput
        id="board-title"
        type="text"
        autocomplete="off"
        [attr.maxlength]="labelLength"
        [value]="title()"
        [attr.aria-invalid]="invalid() ? 'true' : null"
        [attr.aria-describedby]="invalid() ? 'board-title-needed' : null"
        (input)="setTitle(titleInput)"
      />
      @if (invalid()) {
        <p class="needed" id="board-title-needed">Give the board a title.</p>
      }
    </div>

    <fieldset>
      <legend>Layout</legend>
      <div class="kinds">
        @for (name of layouts; track name) {
          <label>
            <input
              type="radio"
              name="board-layout"
              [value]="name"
              [checked]="layout() === name"
              (change)="layout.set(name)"
            />
            {{ layoutLabels[name] }}
          </label>
        }
      </div>
    </fieldset>

    <div class="actions">
      <button type="button" (click)="cancel()">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>
